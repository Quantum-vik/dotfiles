# enable mouse: drag pane borders to resize, click to select, scroll
set -g mouse on

# --- space theme: transparent status bar so the space background shows through ---
set -g status-style "bg=default,fg=colour147"
set -g status-justify centre
set -g status-left "#[fg=colour141,bold] ✦ #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour111]%H:%M #[fg=colour141]✦ #[fg=colour147]%d-%b "
set -g status-right-length 40
setw -g window-status-current-style "bg=colour54,fg=colour231,bold"
setw -g window-status-current-format " ✦ #I:#{b:pane_current_path} "
setw -g window-status-style "fg=colour103"
setw -g window-status-format " #I:#{b:pane_current_path} "
set -g message-style "bg=colour54,fg=colour231"
set -g mode-style "bg=colour54,fg=colour231"

# true-color support (so exact hex colors render correctly)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# pane separation lines: red inactive, light purple = the pane you're currently in
set -g pane-border-lines        double
set -g pane-border-style        "fg=colour124"
set -g pane-active-border-style "fg=colour129"

# dim inactive panes' text; active pane stays bright (both keep the wallpaper)
set -g window-style        "fg=colour244,bg=default"
set -g window-active-style "fg=colour255,bg=default"

# colored label bar on top of each pane, different color per pane box
set -g pane-border-status top
set -g pane-border-format "#[fg=black]#[bg=#{?pane_active,#CBC3E3,colour238}] #P #{pane_current_command} #[default]"

# set prefix to Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "config reloaded!"

# split panes:  ' = vertical (side by side),  " = horizontal (top/bottom)
unbind %
unbind '"'
bind "'" split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# kill the current window with prefix + q
bind q confirm-before -p "kill this window? (y/n)" kill-window

# sticky pane movement: prefix + arrow enters "move mode", then arrows keep
# working without the prefix until you press any other key
bind -T prefix Left  select-pane -L \; switch-client -T panemove
bind -T prefix Right select-pane -R \; switch-client -T panemove
bind -T prefix Up    select-pane -U \; switch-client -T panemove
bind -T prefix Down  select-pane -D \; switch-client -T panemove
bind -T panemove Left  select-pane -L \; switch-client -T panemove
bind -T panemove Right select-pane -R \; switch-client -T panemove
bind -T panemove Up    select-pane -U \; switch-client -T panemove
bind -T panemove Down  select-pane -D \; switch-client -T panemove

# --- plugins (managed by TPM) : save & restore sessions across reboots ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# continuum: auto-save every 5 min and auto-restore when tmux starts
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# resurrect: also bring back the programs running in each pane
set -g @resurrect-capture-pane-contents 'on'

# initialize TPM -- KEEP THIS LINE AT THE VERY BOTTOM OF THE FILE
run '~/.tmux/plugins/tpm/tpm'
