# kitty on Omarchy. Linked from ~/dotfiles/omarchy/kitty/kitty.conf.
# Unlike linux/kitty/kitty.conf (the Ubuntu one, with its own colours and Sonoma background), this follows
# Omarchy's current theme, so `omarchy theme set` restyles kitty too.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

font_size 8.0

# See-through background so Hyprland's blur (hypr/looknfeel.lua) shows behind the text. Text stays opaque.
# Lower for more blur, 1.0 for solid.
background_opacity 0.85

# Ctrl+click opens what is under the cursor, whether or not the program marked it as a link. A terminal only
# receives characters, so a path Claude Code prints is not a link at all: the click selects the word under the
# cursor and hands it to kitty-open-clicked-word, which decides between a URL, a #41 and a file (VS Code, at
# the line). "grabbed" is what keeps this working inside Claude Code, nvim and lazygit, which take the mouse for
# themselves. Ctrl+Shift+click stays kitty's own handler for real links, which open-actions.conf routes.
# Both halves ride on the press: a mapping on the release never runs, because kitty keeps the release of a
# selection to itself. And --allow-remote-control is what lets the script read that selection back -- without it
# kitty hands the child no socket, even under Omarchy's `allow_remote_control socket-only`.
mouse_map ctrl+left press grabbed,ungrabbed combine : mouse_selection word : launch --type=background --allow-remote-control --cwd=current kitty-open-clicked-word
# ':' joins path:line into one word, so a click lands on the line as well as the file.
select_by_word_characters @-./_~?&=%+#:
underline_hyperlinks hover

# Plain text that no program marked as a link -- most of what Claude Code prints -- can't be clicked: the
# terminal only sees characters. These pick it off the screen instead. Each shows a letter beside every match;
# press the letter. Ctrl+Shift+E, kitty's own URL picker, still works too.
#   Ctrl+Shift+F  file paths, as path or path:line, opened in VS Code at that line
#   Ctrl+Shift+I  a GitHub issue or PR number (#123), opened in the browser for the repo the window is in
map ctrl+shift+f kitten hints --type linenum --linenum-action=background code --goto {path}:{line}
map ctrl+shift+i kitten hints --type regex --regex '#(\d+)' --program "launch --type=background --cwd=current gh browse"
