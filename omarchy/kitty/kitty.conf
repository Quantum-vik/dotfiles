# kitty on Omarchy. Linked from ~/dotfiles/omarchy/kitty/kitty.conf.
# Unlike linux/kitty/kitty.conf (the Ubuntu one, with its own colours and Sonoma background), this follows
# Omarchy's current theme, so `omarchy theme set` restyles kitty too.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

font_size 8.0

# See-through background so Hyprland's blur (hypr/looknfeel.lua) shows behind the text. Text stays opaque.
# Lower for more blur, 1.0 for solid.
background_opacity 0.85
