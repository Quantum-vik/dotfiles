# What kitty does with something opened from the terminal: Ctrl+click on a link, or a pick from a hint kitten.
# Linked from ~/dotfiles/omarchy/kitty/open-actions.conf. Rules are tried in order; the first match wins.
# Everything not matched here (http, https, mailto, ssh…) falls through to kitty's defaults, which hand the
# URL to xdg-open, so web links open in Chrome.
# Learn more: https://sw.kovidgoyal.net/kitty/open_actions/

# A file with a line number, as ripgrep writes with --hyperlink-format=kitty (the line is the URL's fragment).
# VS Code jumps to the line. --type=background keeps kitty out of the way: no new window here.
protocol file
fragment_matches ^\d+$
action launch --type=background code --goto $FILE_PATH:$FRAGMENT

# Any other text or source file, without a line to jump to.
protocol file
mime text/*
action launch --type=background code --goto $FILE_PATH

# A directory opens as a VS Code workspace rather than a new terminal, which is kitty's own default.
protocol file
mime inode/directory
action launch --type=background code $FILE_PATH
