# kitty — styled 2026-09-13 to match the WhiteSur-Dark desktop.

# Font: MesloLGS NF is what Powerlevel10k (nerdfont-v3 mode) expects; without a
# Nerd Font the prompt's icons render as empty boxes.
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
font_size        12.0

# Background: the Sonoma wallpaper as an image *inside* the terminal. The window
# itself is solid, so other apps (VS Code etc.) never show through behind it.
# The tint darkens the image toward the background colour so text stays readable;
# raise it (max 1.0) for plainer, lower it for more of the picture.
background_opacity      1.0
background_image        ~/.config/kitty/sonoma-dark.png
background_image_layout scaled
background_tint         0.7

# Window
window_padding_width  8
wayland_titlebar_color background
hide_window_decorations no
remember_window_size  yes
initial_window_width  120c
initial_window_height 34c
confirm_os_window_close 0

# Behaviour
enable_audio_bell no
visual_bell_duration 0
scrollback_lines 20000
copy_on_select no
cursor_shape beam
cursor_blink_interval 0

# Colours — neutral macOS-style dark, with violet accents that sit well beside
# the purple tmux theme.
foreground            #e4e4e8
background            #1c1c21
selection_foreground  #1c1c21
selection_background  #b4a7f5
cursor                #cbc3e3
url_color             #8fb8ff

